<!doctype html>
<!--
  Wakelet × Ellie: LinkedIn cut. 36 s at 120 BPM (beat = 0.5 s = 15 frames). 4:5 (1080×1350) primary, 1:1 secondary.
  Reuses the film.html motion system (squares, member particles, cards, pills, counters, kinetic type, camera, grain).
  Built for muted autoplay: every idea is on-screen text (window.CAPTIONS also feeds captions.srt).
  Safe area: 64 px sides, 64 px top, 120 px clear at the bottom (LinkedIn controls + caption overlay).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wakelet x Ellie: LinkedIn</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("assets/fonts/fraunces-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; }
  :root { --base: #0A0511; --violet: #7C5EFF; --violet2: #9D8BFF; --coral: #C6523F; --cream: #F4F0ED; --ink: #150F1D;
          --grad: linear-gradient(100deg, #7C5EFF 10%, #9D8BFF 45%, #C6523F 95%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--base); color: var(--cream); font-family: "Inter", sans-serif; }
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .layer { position: absolute; inset: 0; }
  #mid { z-index: 1; } #fg { z-index: 2; }
  .abs { position: absolute; }
  .kh { position: absolute; transform: translate(-50%, -50%); text-align: center; font-family: "Fraunces", serif; font-weight: 500; letter-spacing: -0.02em; line-height: 1.0; white-space: nowrap; }
  .kh .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0.03em 0.14em; margin: -0.04em -0.03em -0.14em; }
  .kh .w { display: inline-block; transform-origin: 50% 80%; }
  .kh .gap { display: inline-block; width: 0.26em; }
  .coral { color: var(--coral); }
  .card { position: absolute; background: var(--cream); color: var(--ink); border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden; }
  .t36 { font-family: Inter; font-weight: 600; letter-spacing: -0.01em; }
  .ln { position: absolute; border-radius: 99px; background: rgba(21,15,29,.13); }
  .pill { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 0.45em; white-space: nowrap; font-family: Inter; font-weight: 600; border-radius: 999px; padding: 0.45em 0.95em; }
  .sq { position: absolute; border-radius: 22%; }
  .btn { position: absolute; display: flex; align-items: center; justify-content: center; font-family: Inter; font-weight: 600; border-radius: 14px; }
  #vig { position: absolute; inset: 0; pointer-events: none; z-index: 3; background: radial-gradient(ellipse at 50% 46%, rgba(10,5,17,0) 50%, rgba(25,10,50,.5) 88%, rgba(10,5,17,.85) 115%); }
  #grain { opacity: 0.09; mix-blend-mode: overlay; image-rendering: pixelated; z-index: 4; }
  #flash { position: absolute; inset: 0; background: var(--cream); display: none; z-index: 5; }
  #gradfill { position: absolute; inset: 0; background: linear-gradient(150deg, #7C5EFF 0%, #9D8BFF 38%, #C6523F 100%); display: none; z-index: 0; }
  .photo { position: absolute; overflow: hidden; }
  .photo img { position: absolute; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbg" stdDeviation="0 0" /></filter></svg>
<canvas id="bg"></canvas>
<div id="stage"><div id="gradfill"></div><div class="layer" id="mid"></div><div class="layer" id="fg"></div></div>
<div id="vig"></div>
<canvas id="grain"></canvas>
<div id="flash"></div>

<script src="lib/motion.js"></script>
<script>
"use strict";
window.FILM = { width: 1080, height: 1350, fps: 30, duration: 36.0, bpm: 120, seed: 31, music: "drive" };
const M = window.Motion, { clamp, mix, hash, noise } = M;
const BEAT = 0.5, FR = 1 / 30, b = (n) => n * BEAT;
const C = { base: "#0A0511", violet: "#7C5EFF", violet2: "#9D8BFF", coral: "#C6523F", cream: "#F4F0ED", ink: "#150F1D" };
const E = { out: M.ease.outExpo, back: (x) => M.ease.outBack(x, 1.9), io: M.ease.inOutCubic, inQ: (x) => x * x * x, cub: M.ease.outCubic };
const P = (t, s, d, f = E.out) => f(clamp((t - s) / d));
const pulse = (t, beats, k = 9) => beats.reduce((a, n) => a + (t >= b(n) ? Math.exp(-(t - b(n)) * k) : 0), 0);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || $("mid")).appendChild(e); return e; };
const show = (e, on) => { e.style.display = on ? (e.id === "gradfill" || e.id === "flash" ? "block" : "") : "none"; };
const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const box = (e, x, y, w, h) => { e.style.left = `${x}px`; e.style.top = `${y}px`; e.style.width = `${w}px`; e.style.height = `${h}px`; };

// ---------------------------------------------------------------- layout: 4:5 primary, 1:1 secondary; everything inside the safe box
let W = 1080, H = 1350, S = 1, TALL = true, SAFE = {};
function layout() {
  W = innerWidth; H = innerHeight; S = W / 1080; TALL = H / W > 1.12;
  SAFE = { l: 64 * S, r: W - 64 * S, t: 64 * S, b: H - 120 * S }; SAFE.w = SAFE.r - SAFE.l; SAFE.h = SAFE.b - SAFE.t; SAFE.cx = W / 2;
}
const F = (tall, sq) => (TALL ? tall : sq);                   // pick per format
const Y = (f) => SAFE.t + f * SAFE.h;                         // a y position as a fraction of the safe box

// ---------------------------------------------------------------- KineticHeadline (auto-fit: 85% of safe width, clamped to its zone height)
const HEADS = [];
function Head(words, opts) {
  const e = el("div", "kh", $("fg"));
  const parts = words.map((w, i) => {
    if (w.br) { // w.br === "tall": a break only in 4:5 (in 1:1 it is a space)
      if (w.br === "tall") { el("span", "gap brs", e); el("br", "brt", e); }
      else if (w.br === "sq") { el("span", "gap qbs", e); el("br", "qbt", e); }
      else el("br", null, e);
      return null; }
    if (i && !words[i - 1].br) el("span", "gap", e);
    const m = el("span", "m", e), s = el("span", "w " + (w.cls || ""), m, w.t);
    if (w.sfx) { s.dataset.sfx = w.sfx; s.dataset.sfxGain = w.gain || 0.5; }
    return { s, at: w.at };
  }).filter(Boolean);
  const h = { e, parts, fill: 0.86, dur: 0.32, ...opts }; HEADS.push(h); return h;
}
function drawHead(h, t) {
  const on = t >= h.in - 0.001 && t < h.out; show(h.e, on); if (!on) return;
  const [z0, z1] = h.zone();                                   // vertical zone (fractions of the safe box)
  for (const x of h.e.querySelectorAll(".brt")) x.style.display = TALL ? "" : "none";
  for (const x of h.e.querySelectorAll(".brs")) x.style.display = TALL ? "none" : "inline-block";
  for (const x of h.e.querySelectorAll(".qbt")) x.style.display = TALL ? "none" : "";
  for (const x of h.e.querySelectorAll(".qbs")) x.style.display = TALL ? "inline-block" : "none";
  h.e.style.fontSize = "100px";
  const ow = h.e.offsetWidth, oh = h.e.offsetHeight;
  const size = Math.min(100 * (h.fill * SAFE.w) / ow, 100 * ((z1 - z0) * SAFE.h) / oh, (h.max || 400) * S);
  h.e.style.fontSize = `${size}px`; h.e.style.left = `${SAFE.cx}px`; h.e.style.top = `${Y((z0 + z1) / 2)}px`;
  const kout = h.exit ? P(t, h.out - h.exit, h.exit, E.io) : 0;
  for (const p of h.parts) {
    const k = P(t, p.at, h.dur, E.out), kp = P(t, p.at, 0.3, E.back);
    p.s.style.transform = `translateY(${(1 - k) * 105 - kout * 105}%) scale(${mix(1.2, 1, kp)})`;
  }
}

// ---------------------------------------------------------------- Pill / Counter / Camera
function count(e, t, at, to, dur = 0.9) { e.textContent = Math.round(mix(0, to, P(t, at, dur, E.cub))); }
function springIn(t, at, v = 5) { return Math.max(0, M.spring(t, at, { stiffness: 460, damping: 20, velocity: v })); }
function camera(t) {
  let x = 0, y = 0, s = 1;
  const scenes = [[0, b(6)], [b(6), b(14)], [b(14), b(18)], [b(18), b(30)], [b(30), b(40)], [b(40), b(48)], [b(48), b(56)], [b(56), b(66)], [b(66), 36]];
  for (const [a, z] of scenes) if (t >= a && t < z) s *= 1 + 0.04 * clamp((t - a) / (z - a));
  for (const [at, amp] of [[b(6), 8], [b(7), 8], [b(8), 8], [b(9), 8], [b(14), 14], [b(46), 8], [b(48), 16], [b(67), 10]]) {
    const d = t - at; if (d < 0 || d > 0.5) continue; const k = Math.exp(-d * 11) * amp * S;
    x += noise(d * 38, at * 13) * k; y += noise(d * 41, at * 17 + 3) * k;
  }
  for (const at of [b(40), b(56)]) { // whip-pans
    if (t >= at - 0.2 && t < at) x -= P(t, at - 0.2, 0.2, E.inQ) * W * 0.9;
    if (t >= at && t < at + 0.28) x += (1 - P(t, at, 0.28, E.out)) * W * 0.9;
  }
  return { x, y, s };
}

// ---------------------------------------------------------------- Members: 200 squares, already moving at frame 0
const N = 200;
const MEM = Array.from({ length: N }, (_, i) => {
  const r = (k) => hash(i, 300 + k); const loud = i < 9, quiet = !loud && r(5) < 0.42;
  return { hx: 0.03 + r(0) * 0.94, hy: 0.03 + r(1) * 0.94, small: 6 + r(2) * 8, own: loud ? 44 + r(3) * 30 : quiet ? 8 + r(3) * 6 : 10 + r(3) * 8, loud, quiet, sp: 0.3 + r(6) * 0.8, ph: r(7) * 100, ang: r(4) * 6.283 };
});
function memberPos(m, t) {
  let x = m.hx + noise(t * 0.3 * m.sp + m.ph, 1) * 0.03, y = m.hy + noise(t * 0.27 * m.sp + m.ph, 2) * 0.03 - t * 0.004 * m.sp;
  const kc = P(t, b(66), 0.5, E.inQ); // lockup: everyone rushes to the monogram
  return [mix(x, 0.5, kc), mix(y, 0.4, kc)];
}
function drawMembers(ctx, t, cam) {
  if (t >= b(67)) return;
  const vis = t < b(6) ? 1 : t < b(31.5) ? 0.35 : t < b(40) ? 1 : t < b(48) ? 0.3 : t < b(66) ? 0 : 1;
  if (!vis) return;
  const field = clamp(M.spring(t, b(31.5), "gentle")) * (1 - P(t, b(40), 0.3));
  const scanX = mix(-0.15, 1.15, P(t, b(32), 2.0, E.io));
  for (const m of MEM) {
    const [ux, uy] = memberPos(m, t);
    const px = W / 2 + (ux * W - W / 2) * (1 + (cam.s - 1) * 0.5) + cam.x * 0.5, py = H / 2 + (uy * H - H / 2) * (1 + (cam.s - 1) * 0.5) + cam.y * 0.5;
    let size = mix(m.small, m.own, field) * S, a = (m.quiet ? mix(0.6, 0.3, field) : 0.85) * vis, col = C.violet, glow = 0;
    if (m.loud && field > 0.1) { col = C.violet2; a = mix(a, 0.35, P(t, b(33), 1.0)); glow = 24; } // loud squares dim as the quiet ones light
    if (m.quiet && t >= b(32) && t < b(40) && scanX > m.hx) {
      const tl = b(32) + 2.0 * clamp((m.hx + 0.15) / 1.3);
      col = C.coral; a = 0.95; glow = 20; size *= mix(1, 1.9, Math.max(0, M.spring(t, tl, "pop"))) * (1 + 0.4 * pulse(t, [37, 38, 39], 7));
    }
    ctx.shadowBlur = glow * S; ctx.shadowColor = hex(col, 0.85); ctx.fillStyle = hex(col, a);
    ctx.beginPath(); ctx.roundRect(px - size / 2, py - size / 2, size, size, size * 0.22); ctx.fill();
  }
  ctx.shadowBlur = 0;
  if (t >= b(32) && t < b(36.5)) {
    const x = scanX * W + cam.x * 0.5, g = ctx.createLinearGradient(x - 100 * S, 0, x + 6 * S, 0);
    g.addColorStop(0, hex(C.coral, 0)); g.addColorStop(1, hex(C.coral, 0.55)); ctx.fillStyle = g; ctx.fillRect(x - 100 * S, 0, 106 * S, H);
    ctx.fillStyle = hex(C.coral, 0.95); ctx.fillRect(x, 0, 3 * S, H);
  }
}

// ---------------------------------------------------------------- grain
const GR = $("grain"), gctx = GR.getContext("2d"); GR.width = 360; GR.height = 450;
const tiles = Array.from({ length: 4 }, (_, k) => { const id = gctx.createImageData(360, 450), rnd = M.mulberry32(77 + k); for (let i = 0; i < id.data.length; i += 4) { const v = rnd() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } return id; });

// ================================================================= 1 · HOOK (words on screen by frame 8)
let tNow = 0;
const H1a = Head([{ t: "Thousands", at: 0.2, sfx: "impact", gain: 0.6 }, { br: "tall" }, { t: "of", at: 0.2 }, { br: "sq" }, { t: "members.", at: 0.2 }], { in: 0.2, out: b(3), dur: 0.12, zone: () => [0.3, 0.62] });
const H1b = Head([{ t: "Two", at: b(3), sfx: "tick", gain: 0.9 }, { br: 1 }, { t: "people.", at: b(3.5) }], { in: b(3), out: b(6), zone: () => [0.2, 0.75], max: 330 });

// ================================================================= 2 · THE GRIND: big cards pile up, an NPS card among them
const sheet = (c) => { c.innerHTML = `<div class="t36" style="position:absolute;left:6%;top:7%;font-size:${36}px">Members.xlsx</div>`; for (let r = 0; r < 6; r++) for (let k = 0; k < 4; k++) { const d = el("div", "", c); d.style.cssText = `position:absolute;left:${6 + k * 22}%;top:${28 + r * 11}%;width:20%;height:8.5%;border-radius:5px;background:${(r + k) % 5 === 0 ? "rgba(124,94,255,.4)" : "rgba(21,15,29,.10)"}`; } };
const docC = (c) => { c.innerHTML = `<div class="t36" style="position:absolute;left:7%;top:8%;font-size:36px">Community notes</div>`; [[30, 82], [41, 70], [52, 86], [63, 60], [74, 78]].forEach(([y, w]) => { const d = el("div", "ln", c); d.style.cssText += `left:7%;top:${y}%;width:${w}%;height:5.5%`; }); };
const contactC = (c) => { c.innerHTML = `<div style="position:absolute;left:7%;top:10%;width:17%;aspect-ratio:1;border-radius:50%;background:${C.violet2}"></div><div class="t36" style="position:absolute;left:29%;top:11%;font-size:36px">CRM contact</div><div style="position:absolute;left:29%;top:27%;font-size:30px;color:rgba(21,15,29,.6)">Lifecycle: customer</div>`; [[55, 84], [68, 64], [81, 74]].forEach(([y, w]) => { const d = el("div", "ln", c); d.style.cssText += `left:7%;top:${y}%;width:${w}%;height:6%`; }); };
const npsC = (c) => { c.innerHTML = `<div class="t36" style="position:absolute;left:7%;top:8%;font-size:36px">NPS survey</div>`; [[C.violet, 62], [C.violet2, 40], [C.coral, 24]].forEach(([col, w], i) => { const d = el("div", "", c); d.style.cssText = `position:absolute;left:7%;top:${36 + i * 18}%;width:${w * 1.3}%;height:11%;border-radius:8px;background:${col}`; }); };
const PILE = [
  { make: sheet, from: [-1.0, 0.5], to: [0.42, 0.54], rot: -6, at: 6 },
  { make: docC, from: [1.1, 0.4], to: [0.6, 0.62], rot: 5, at: 7 },
  { make: contactC, from: [0.4, 1.4], to: [0.45, 0.72], rot: 3, at: 8 },
  { make: npsC, from: [0.7, 1.5], to: [0.57, 0.8], rot: -4, at: 9 },
].map((m, i) => { const c = el("div", "card", $("mid")); m.make(c); c.dataset.sfx = "whoosh"; c.dataset.sfxGain = 0.4; return { ...m, c, i }; });
const H2a = Head([{ t: "Reports", at: b(6), sfx: "tick", gain: 0.6 }, { t: "in", at: b(6.5) }, { br: 1 }, { t: "four", at: b(7) }, { t: "places.", at: b(7.5) }], { in: b(6), out: b(10), fill: 0.9, zone: () => [0.04, F(0.3, 0.27)] });
const H2b = Head([{ t: "Hours.", at: b(10), sfx: "impact", gain: 0.5 }, { br: 1 }, { t: "Every", at: b(11) }, { t: "week.", at: b(11.5), cls: "coral" }], { in: b(10), out: b(14), fill: 0.9, zone: () => [0.04, F(0.3, 0.27)] });

// ================================================================= 3 · ELLIE: cream flash, coral square slices the pile
const ellieSq = el("div", "sq", $("mid")); ellieSq.style.background = C.coral; ellieSq.style.boxShadow = "0 0 90px rgba(198,82,63,.75)";
const H3 = Head([{ t: "Meet", at: b(15), sfx: "impact", gain: 0.6 }, { t: "Ellie.", at: b(15.5), cls: "coral" }], { in: b(15), out: b(18), zone: () => [0.05, 0.3] });

// ================================================================= 4 · HERO: the brief builds itself
const SRC = ["Docs", "Sheets", "HubSpot", "NPS"].map((n, i) => { const p = el("div", "pill", $("mid"), `<span style="width:.75em;height:.75em;border-radius:22%;background:${[C.violet, C.violet2, C.coral, C.violet][i]}"></span>${n}`); p.style.background = "rgba(244,240,237,.1)"; p.style.color = C.cream; p.style.border = "2px solid rgba(244,240,237,.25)"; p.dataset.sfx = "tick"; p.dataset.sfxGain = 0.4; return p; });
const streams = el("canvas", "", $("mid")); streams.style.pointerEvents = "none";
const brief = el("div", "card", $("mid"));
brief.innerHTML = `
  <div class="bh" style="position:absolute;left:5.5%;top:4.5%;right:5.5%;display:flex;align-items:center;gap:.5em">
    <span style="width:1em;height:1em;border-radius:22%;background:${C.coral};box-shadow:0 0 18px rgba(198,82,63,.6)"></span>
    <span style="font-family:Fraunces;font-weight:500;font-size:1.32em;letter-spacing:-.02em">Weekly community brief</span></div>
  <div class="bs" style="position:absolute;left:5.5%;top:14%;font-size:.95em;color:rgba(21,15,29,.6)">Mon 08:00 · built by Ellie</div>
  <div class="s1" style="position:absolute;left:5.5%;right:5.5%;top:25%">
    <div style="font-weight:600;font-size:.95em">NPS summary</div>
    <div style="display:flex;height:.9em;margin-top:.45em;border-radius:10px;overflow:hidden"><span class="b1" style="width:58%;background:${C.violet}"></span><span class="b2" style="width:27%;background:${C.violet2}"></span><span class="b3" style="width:15%;background:${C.coral}"></span></div></div>
  <div class="s2" style="position:absolute;left:5.5%;right:5.5%;top:43%">
    <div style="font-weight:600;font-size:.95em">Top themes</div>
    <div style="display:flex;gap:.4em;margin-top:.45em;flex-wrap:wrap">${["Onboarding", "Events", "Ambassadors"].map((x) => `<span class="th" style="display:inline-block;background:rgba(124,94,255,.14);color:${C.ink};border-radius:999px;padding:.25em .7em;font-weight:500;font-size:.95em">${x}</span>`).join("")}</div></div>
  <div class="s3" style="position:absolute;left:5.5%;right:5.5%;top:63%;bottom:12%;display:flex;gap:4%">
    ${[["Going quiet", C.coral, "gq"], ["Returning", C.violet, "rt"]].map(([l, c, id]) => `<div class="tile" id="tile-${id}" style="flex:1;border-radius:18px;background:rgba(21,15,29,.06);position:relative"><div style="position:absolute;left:9%;top:12%;font-weight:600;font-size:.95em;display:flex;align-items:center;gap:.4em"><span style="width:.7em;height:.7em;border-radius:22%;background:${c}"></span>${l}</div><div class="num" id="n-${id}" style="position:absolute;left:9%;bottom:8%;font-family:Fraunces;font-weight:500;font-size:2.6em;letter-spacing:-.02em;line-height:1">0</div></div>`).join("")}</div>
  <div class="s4" style="position:absolute;left:5.5%;bottom:3.5%;font-size:.95em;color:rgba(21,15,29,.5)">Illustrative data</div>`;
brief.dataset.sfx = "whoosh"; brief.dataset.sfxGain = 0.5;
const BS = ["bh", "bs", "s1", "s2", "s3", "s4"].map((c) => brief.querySelector("." + c));
const themes = [...brief.querySelectorAll(".th")], tiles2 = [...brief.querySelectorAll(".tile")];
tiles2.forEach((tl) => { tl.dataset.sfx = "pop"; tl.dataset.sfxGain = 0.5; });
const H4 = [
  Head([{ t: "One", at: b(18), sfx: "tick", gain: 0.5 }, { t: "brief.", at: b(18.5) }], { in: b(18), out: b(22), zone: () => [0.045, 0.2] }),
  Head([{ t: "Every", at: b(22) }, { br: 1 }, { t: "Monday.", at: b(22.5), cls: "coral" }], { in: b(22), out: b(26), zone: () => [0.045, F(0.3, 0.33)] }),
  Head([{ t: "On", at: b(26) }, { t: "its", at: b(26.25) }, { t: "own.", at: b(26.5) }], { in: b(26), out: b(30), zone: () => [0.045, 0.2] }),
];

// ================================================================= 5 · THE QUIET ONES
const zoomSq = el("div", "sq", $("fg")); zoomSq.style.background = C.coral;
