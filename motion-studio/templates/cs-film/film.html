<!doctype html>
<!--
  Central Square AI: starter film. A pure function of time: window.seek(t) paints frame t.
  Render:  node ../../scripts/render.mjs film.html --sheet   (review: one frame per beat)
           node ../../scripts/render.mjs film.html           (full: H.264 yuv420p CRF 16 + synthesized score/SFX)
  Rules: no CSS transitions/animations, no timers, no rAF, no Math.random (use rand = mulberry32(seed)).
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Central Square AI — film</title>
<style>
  /* Brand: brand/tokens.css (live centralsquare.ai tokens). Faces repeated here so the film is self-contained. */
  @font-face { font-family: "Geist"; src: url("assets/fonts/geist-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Geist"; src: url("assets/fonts/geist-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "Geist Mono"; src: url("assets/fonts/geist-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-display: block; }

  :root {
    --ground: #F6F4FB; --ink: #1B1726; --ink2: #55506A; --ink3: #8C879C; --line: rgba(27,23,38,.16);
    --violet: #6B4EFF; --violet-ink: #4F35D9; --violet-soft: rgba(107,78,255,.10); --coral: #C9573F;
    --grad: linear-gradient(95deg, #6B4EFF 15%, #B24FC0 60%, #D9623F);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--ground); color: var(--ink); font-family: "Geist", system-ui, sans-serif; }

  /* Soft colour fields (lavender, peach, blue) drifting slowly behind everything */
  .field { position: absolute; border-radius: 50%; width: 90vmax; height: 90vmax; margin: -45vmax 0 0 -45vmax; }
  #f1 { background: radial-gradient(closest-side, rgba(211,199,255,.85), rgba(211,199,255,0)); }
  #f2 { background: radial-gradient(closest-side, rgba(255,227,214,.8), rgba(255,227,214,0)); }
  #f3 { background: radial-gradient(closest-side, rgba(207,228,255,.6), rgba(207,228,255,0)); }

  /* Landscape: copy left, network right. Portrait/square reflow below. Sizes in vmin. */
  #copy { position: absolute; left: 8vw; top: 50%; transform: translateY(-50%); width: 56vw; }
  #net  { position: absolute; width: 72vmin; height: 72vmin; left: 72vw; top: 50%; margin: -36vmin 0 0 -36vmin; }
  @media (orientation: portrait) {
    #copy { left: 8vw; top: 10vh; transform: none; width: 84vw; }
    #net  { left: 50vw; top: 66vh; width: 88vmin; height: 88vmin; margin: -44vmin 0 0 -44vmin; }
  }
  @media (aspect-ratio: 1/1) {
    #copy { left: 8vw; top: 8vh; transform: none; width: 84vw; }
    #net  { left: 75vw; top: 75vh; width: 42vmin; height: 42vmin; margin: -21vmin 0 0 -21vmin; }
  }

  .mask { overflow: hidden; display: block; padding-bottom: 0.08em; }
  .mask > span { display: inline-block; will-change: transform; }
  /* Mono chip, as on the site: violet ink on violet-soft, pill */
  #kicker { font-family: "Geist Mono", monospace; font-weight: 500; font-size: 2.9vmin; text-transform: uppercase; letter-spacing: -0.02em;
            color: var(--violet-ink); background: var(--violet-soft); border-radius: 999px; padding: 0.7vmin 1.6vmin; white-space: nowrap; }
  #headline { margin-top: 3.2vmin; font-weight: 400; font-size: 10.8vmin; line-height: 1.0; letter-spacing: -0.045em; }
  /* The signature: gradient on the emphasis line (house-rule exception, see CLAUDE.md) */
  #accent { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 0.06em; }
  #cta-row { margin-top: 5.5vmin; display: inline-block; }
  #cta { position: relative; font-family: "Geist Mono", monospace; font-weight: 500; font-size: 3.2vmin; letter-spacing: -0.02em; color: #fff;
         padding: 1.7vmin 3vmin; border-radius: 1vmin; display: inline-block; overflow: hidden; }
  #cta-fill { position: absolute; inset: 0; background: var(--violet); transform-origin: 0 50%; }
  #cta-text { position: relative; }

  #net svg { width: 100%; height: 100%; overflow: visible; }
  #net line { stroke: var(--line); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  #net line.hot { stroke: var(--violet); stroke-width: 2.2; }
  #net circle.node { fill: var(--ink); }
  #net rect.hub { fill: var(--violet); }   /* the logo's violet rounded square */
  #net circle.pulse { fill: none; stroke: var(--violet); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
</style>
</head>
<body>
  <div id="f1" class="field"></div><div id="f2" class="field"></div><div id="f3" class="field"></div>
  <div id="net"><svg viewBox="-500 -500 1000 1000"><g id="links"></g><circle id="pulse" class="pulse" r="0" /><g id="nodes"></g></svg></div>

  <div id="copy">
    <div class="mask" style="display:inline-block"><span id="kicker" data-sfx="tick" data-sfx-gain="0.7">The community layer of the agentic era</span></div>
    <div id="headline">
      <span class="mask"><span id="h1" data-sfx="whoosh" data-sfx-gain="0.5">Your community</span></span>
      <span class="mask"><span id="h2">is your moat.</span></span>
      <span class="mask"><span id="h3" data-sfx="impact" data-sfx-gain="0.6"><span id="accent">Ellie helps run it.</span></span></span>
    </div>
    <div id="cta-row"><span class="mask"><span id="cta" data-sfx="thud"><span id="cta-fill"></span><span id="cta-text">Book a demo &rarr; centralsquare.ai</span></span></span></div>
  </div>

<script src="lib/motion.js"></script>
<script>
// ---------------------------------------------------------------- film spec
window.FILM = { width: 1920, height: 1080, fps: 30, duration: 9.6, bpm: 100, seed: 7 };

// ---------------------------------------------------------------- pure helpers (lib/motion.js)
const { clamp, mix, prog, ease: E, spring, mulberry32, rise } = window.Motion;
const rand = mulberry32(FILM.seed);

// ---------------------------------------------------------------- beat grid (injected by render.mjs from beats.json)
const { SPB, beat } = window.Motion.grid(FILM, window.BEATS);

// Story on the grid: something new every 2–4 beats (1.2–2.4 s).
const T = {
  hub: beat(0) - 0.15,  // hook: the violet hub (the logo square) is already landing on frame 0
  ring1: beat(0) - 0.3, // first communities are already connecting on frame 0
  words: beat(1),       // "Your community / is your moat." rising by 0.6 s
  accent: beat(4),      // downbeat, drums in: the gradient line + the violet link
  ring2: beat(6),       // the network grows, camera eases back
  kicker: beat(8),      // downbeat: brand line
  cta: beat(10),        // CTA + underline
  pulse: beat(12),      // downbeat: one pulse from the hub, then hold
};

// ---------------------------------------------------------------- the network (data, seeded)
const ring1 = [[-230, -170], [210, -210], [250, 170], [-200, 210]];
const ring2 = [];
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + (rand() - 0.5) * 0.35;
  const r = 360 + rand() * 70;
  const x = Math.cos(a) * r, y = Math.sin(a) * r;
  let parent = 0, best = Infinity;
  ring1.forEach(([px, py], k) => { const d = (px - x) ** 2 + (py - y) ** 2; if (d < best) { best = d; parent = k; } });
  ring2.push([x, y, parent]);
}
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const gl = document.getElementById("links"), gn = document.getElementById("nodes");
const L1 = ring1.map(() => el("line", { pathLength: 1, "stroke-dasharray": 1 }, gl));
const L2 = ring2.map(() => el("line", { pathLength: 1, "stroke-dasharray": 1 }, gl));
// data-sfx: the renderer measures these on screen every frame; the moment each appears becomes a sound cue
// (panned by where it is, weighted by its size). No hand-timed cue list to drift out of sync.
const N1 = ring1.map((_, i) => el("circle", { id: `n1-${i}`, class: "node", r: 9, "data-sfx": "tick", "data-sfx-gain": 0.8 }, gn));
const N2 = ring2.map((_, i) => el("circle", { id: `n2-${i}`, class: "node", r: 6, "data-sfx": "tick", "data-sfx-gain": 0.4 }, gn));
const hub = el("rect", { id: "hub", class: "hub", "data-sfx": "pop" }, gn);
const pulse = document.getElementById("pulse");

const $ = (id) => document.getElementById(id);
const drift = (i, t, amp) => [Math.sin(t * 0.7 + i * 1.7) * amp, Math.cos(t * 0.55 + i * 2.3) * amp];

// ---------------------------------------------------------------- seek(t): the whole film
window.seek = function (t) {
  // network camera: eases back on the ring2 downbeat to make room
  const cam = spring(t, T.ring2, "gentle");
  $("net").style.transform = `scale(${mix(1.3, 0.98, cam)}) rotate(${mix(0, -6, prog(t, 0, FILM.duration, (x) => x))}deg)`;

  const kh = Math.max(0, spring(t, T.hub, "pop")), hs = 34 * kh; // rounded square, 25% corner radius like the logo
  hub.setAttribute("x", -hs / 2); hub.setAttribute("y", -hs / 2); hub.setAttribute("width", hs); hub.setAttribute("height", hs); hub.setAttribute("rx", hs * 0.25);

  // colour fields drift: a pure function of t
  const f = [[0.18, 0.12, 0], [0.92, 0.95, 1], [0.95, 0.1, 2]];
  f.forEach(([x, y, k], i) => { const el = $(`f${i + 1}`); el.style.left = `${(x + 0.04 * Math.sin(t * 0.25 + k * 2)) * 100}vw`; el.style.top = `${(y + 0.04 * Math.cos(t * 0.21 + k)) * 100}vh`; });

  ring1.forEach(([x, y], i) => {
    const s = T.ring1 + i * SPB * 0.5;
    const [dx, dy] = drift(i, t, 8);
    const kl = prog(t, s - 0.05, 0.45, E.outCubic);
    const kn = Math.max(0, spring(t, s + SPB * 0.5, "pop"));
    L1[i].setAttribute("x1", 0); L1[i].setAttribute("y1", 0);
    L1[i].setAttribute("x2", x + dx); L1[i].setAttribute("y2", y + dy);
    L1[i].setAttribute("stroke-dashoffset", 1 - kl);
    N1[i].setAttribute("cx", x + dx); N1[i].setAttribute("cy", y + dy); N1[i].setAttribute("r", 9 * kn);
  });

  ring2.forEach(([x, y, parent], i) => {
    const s = T.ring2 + i * SPB / 4; // one node per 16th note: the stagger stays on the grid
    const [dx, dy] = drift(i + 10, t, 10);
    const [px, py] = ring1[parent], [pdx, pdy] = drift(parent, t, 8);
    const kl = prog(t, s, 0.6, E.outCubic), kn = Math.max(0, spring(t, s + SPB / 2, "pop"));
    L2[i].setAttribute("x1", px + pdx); L2[i].setAttribute("y1", py + pdy);
    L2[i].setAttribute("x2", x + dx); L2[i].setAttribute("y2", y + dy);
    L2[i].setAttribute("stroke-dashoffset", 1 - kl);
    N2[i].setAttribute("cx", x + dx); N2[i].setAttribute("cy", y + dy); N2[i].setAttribute("r", 6 * kn);
  });

  // the one violet link: lights when the gradient line lands
  L1.forEach((l, i) => l.classList.toggle("hot", i === 0 && t >= T.accent));

  const kp = prog(t, T.pulse, 1.1, E.outCubic);
  pulse.setAttribute("r", 20 + kp * 420);
  pulse.setAttribute("stroke-opacity", t >= T.pulse ? (1 - kp) * 0.8 : 0);

  // copy: masked rises, never fades
  rise($("h1"), prog(t, T.words, 0.7));
  rise($("h2"), prog(t, T.words + SPB * 0.5, 0.7));
  rise($("h3"), prog(t, T.accent, 0.7));
  rise($("kicker"), Math.min(1, spring(t, T.kicker, "snappy")));
  rise($("cta"), Math.min(1, spring(t, T.cta, "snappy")));
  $("cta-fill").style.transform = `scaleX(${prog(t, T.cta, 0.7, E.outExpo)})`;
};

// Manual cues only for what the picture can't express as an element appearing (here: the hub's pulse ring).
window.CUES = [
  { t: T.pulse, sfx: "chime", gain: 0.45 },
];

seek(0);
</script>
</body>
</html>
