<template>
  <style>
    /* Brand faces: keep in sync with motion-studio/brand/tokens.css */
    @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
    @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/inter-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }

    #root {
      --ground: #0b0b0b; --ink: #fafafa; --muted: #a3a3a3; --amber: #f59e0b;
      position: absolute; inset: 0; background: var(--ground); overflow: hidden;
      font-family: "Inter", system-ui, sans-serif; color: var(--ink);
    }
    /* Everything is sized in vmin so the same scene works at 16:9, 9:16 and 1:1. */
    #glow {
      position: absolute; left: 50%; top: 50%; width: 120vmin; height: 120vmin; margin: -60vmin 0 0 -60vmin;
      background: radial-gradient(circle, rgba(245,158,11,0.16) 0%, rgba(245,158,11,0.05) 35%, rgba(11,11,11,0) 65%);
    }
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; }
    #sky line { stroke: #f59e0b; stroke-opacity: 0.38; stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1; }
    #sky circle { fill: #fafafa; }
    #sky circle.hub { fill: #f59e0b; }
    #copy {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 10vmin;
    }
    #kicker { font-weight: 500; font-size: 2.6vmin; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
    #headline-wrap { margin-top: 3.2vmin; font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 10.5vmin; line-height: 1.02; letter-spacing: -0.02em; }
    #headline, #accent { display: inline-block; }
    #accent { font-style: italic; font-weight: 400; color: var(--amber); padding-left: 0.18em; }
    #rule { width: 9vmin; height: 2px; margin-top: 5vmin; background: var(--amber); transform-origin: 50% 50%; }
    #cta { margin-top: 3.4vmin; font-weight: 500; font-size: 3vmin; letter-spacing: 0.04em; color: var(--ink); }
  </style>

  <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
    <div id="glow" class="clip" data-layout-allow-overflow data-start="0" data-duration="6" data-track-index="0"></div>

    <!-- Constellation: fixed coordinates (deterministic). viewBox slices to fill any aspect ratio. -->
    <svg id="sky" class="clip" data-layout-allow-overflow data-start="0" data-duration="6" data-track-index="1" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
      <g id="links">
        <line pathLength="1" x1="500" y1="500" x2="300" y2="330" />
        <line pathLength="1" x1="500" y1="500" x2="720" y2="300" />
        <line pathLength="1" x1="500" y1="500" x2="760" y2="690" />
        <line pathLength="1" x1="500" y1="500" x2="260" y2="700" />
        <line pathLength="1" x1="300" y1="330" x2="140" y2="440" />
        <line pathLength="1" x1="720" y1="300" x2="880" y2="410" />
        <line pathLength="1" x1="760" y1="690" x2="620" y2="860" />
        <line pathLength="1" x1="260" y1="700" x2="390" y2="870" />
        <line pathLength="1" x1="300" y1="330" x2="470" y2="170" />
        <line pathLength="1" x1="720" y1="300" x2="470" y2="170" />
      </g>
      <g id="nodes">
        <circle cx="300" cy="330" r="5" /><circle cx="720" cy="300" r="5" /><circle cx="760" cy="690" r="5" />
        <circle cx="260" cy="700" r="5" /><circle cx="140" cy="440" r="3.5" /><circle cx="880" cy="410" r="3.5" />
        <circle cx="620" cy="860" r="3.5" /><circle cx="390" cy="870" r="3.5" /><circle cx="470" cy="170" r="3.5" />
        <circle class="hub" cx="500" cy="500" r="7" />
      </g>
    </svg>

    <div id="copy" class="clip" data-start="0" data-duration="6" data-track-index="2">
      <div id="kicker" data-var-text="kicker">Central Square AI</div>
      <div id="headline-wrap"><span id="headline" data-var-text="headline">Where communities</span><span id="accent" data-var-text="accent">thrive.</span></div>
      <div id="rule"></div>
      <div id="cta" data-var-text="cta">centralsquare.ai</div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const nodes = gsap.utils.toArray("#endcard #nodes circle");
    const links = gsap.utils.toArray("#endcard #links line");

    // 0.0–1.4  the network assembles: nodes arrive, links draw out from the hub
    tl.fromTo("#glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 2.2, ease: "power2.out" }, 0);
    tl.fromTo(nodes, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)", stagger: 0.06 }, 0.1);
    tl.to(links, { strokeDashoffset: 0, duration: 0.7, ease: "power3.out", stagger: 0.07 }, 0.35);

    // 1.4–2.2  the network recedes so the copy owns the frame
    tl.to("#sky", { opacity: 0.32, scale: 1.08, transformOrigin: "50% 50%", duration: 1.6, ease: "power3.inOut" }, 1.3);

    // 1.6–3.0  copy, one idea at a time
    tl.fromTo("#kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 1.6);
    tl.fromTo("#headline", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 1.8);
    tl.fromTo("#accent", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 2.15);
    tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 2.6);
    tl.fromTo("#cta", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 2.8);

    // 3.4–6.0  hold; a slow push keeps the last frame alive without fighting the read
    tl.fromTo("#copy", { scale: 1 }, { scale: 1.025, transformOrigin: "50% 50%", duration: 2.55, ease: "none" }, 3.4);

    window.__timelines["endcard"] = tl;
  </script>
</template>
